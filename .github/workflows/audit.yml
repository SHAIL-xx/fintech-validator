name: DevSecOps Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  infrastructure-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start LocalStack via Docker Compose
        # This uses the docker-compose.yml already in your repository
        run: docker compose up -d

      - name: Verify LocalStack Readiness
        # Polling guarantees it is ready before Terraform starts
        run: |
          echo "Polling LocalStack health endpoint..."
          while ! curl -s http://127.0.0.1:4566/_localstack/health | grep -q "version"; do
            sleep 2
          done
          echo "LocalStack is fully operational."

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Mock Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Execute FinTech Validator
        run: python3 validator.py