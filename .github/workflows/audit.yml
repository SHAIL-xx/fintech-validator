name: DevSecOps Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"

jobs:
  infrastructure-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Start LocalStack (Isolated Container)
        # Direct docker run guarantees no hidden repo configs can trigger Pro features
        run: docker run -d --name localstack_main -p 4566:4566 -e DEFAULT_REGION=us-east-1 localstack/localstack:latest

      - name: Verify LocalStack Readiness
        run: |
          echo "Polling LocalStack health endpoint..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4566/_localstack/health | grep -q "\"version\""; then
              echo "LocalStack is fully operational."
              exit 0
            fi
            sleep 2
          done
          
          echo "[FATAL] LocalStack failed to initialize within 60 seconds."
          echo "Dumping container logs for debugging:"
          docker logs localstack_main
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Mock Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Execute FinTech Validator
        run: python3 validator.py

      - name: Upload Compliance Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance_report.json
          retention-days: 7