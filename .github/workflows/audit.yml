name: DevSecOps Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Prevents Boto3 and Terraform from hanging while looking for real credentials
env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"

jobs:
  infrastructure-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Explicit installation guarantees no missing requirements.txt errors
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Start LocalStack via Docker Compose
        run: docker compose up -d

      - name: Verify LocalStack Readiness
        # Bulletproof bounded polling loop with automatic log dumping on failure
        run: |
          echo "Polling LocalStack health endpoint..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4566/_localstack/health | grep -q "\"version\""; then
              echo "LocalStack is fully operational."
              exit 0
            fi
            sleep 2
          done
          
          echo "[FATAL] LocalStack failed to initialize within 60 seconds."
          echo "Dumping container logs for debugging:"
          docker compose logs
          exit 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Mock Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Execute FinTech Validator
        run: python3 validator.py

      - name: Upload Compliance Report Artifact
        # Ensures the JSON report is uploaded even if the python script fails the build
        if: always()
        uses: actions/upload-artifact