name: DevSecOps Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  infrastructure-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start LocalStack Emulator
        run: |
          docker compose up -d
          echo "Waiting for LocalStack to initialize..."
          sleep 15

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Mock Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Execute FinTech Validator
        # This step will throw an exit code 1 if vulnerabilities are found, failing the build
        run: python3 validator.py