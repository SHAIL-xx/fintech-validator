name: DevSecOps Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  infrastructure-audit:
    runs-on: ubuntu-latest
    
    # SURESHOT FIX: Native GitHub Service Container
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam,kms
          DEFAULT_REGION: us-east-1
          
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify LocalStack Readiness
        # Native curl polling guarantees port 4566 is accepting traffic
        run: |
          echo "Polling LocalStack health endpoint..."
          while ! curl -s http://127.0.0.1:4566/_localstack/health | grep -q "version"; do
            sleep 2
          done
          echo "LocalStack is fully operational."

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Mock Infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Execute FinTech Validator
        run: python3 validator.py